<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110f"><meta name="description" content="BINARY 30 private offline binary trade journal with encrypted portable backups.">
<meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>BINARY 30 · Offline Trade Journal</title></head>
<body style="margin:0;background:#07110f;color:#ecf8f0;font:14px system-ui;min-height:100vh;display:grid;place-items:center">
<div id="boot" style="text-align:center;padding:30px;color:#a8c4b0"><div style="font-size:26px;font-weight:900;letter-spacing:2px;color:#9cf4b6">BINARY 30</div><p>Opening your private journal…</p></div>
<script>
(async()=>{
 const names=['./bundle-1.txt','./bundle-2.txt','./bundle-3.txt'];
 const parts=await Promise.all(names.map(async name=>{const r=await fetch(name);if(!r.ok)throw new Error('App package part could not be loaded: '+name);return (await r.text()).trim();}));
 const b64=parts.join(''); const bin=atob(b64); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(!('DecompressionStream' in window)) throw new Error('This browser is too old. Please update Chrome.');
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const payload=await new Response(stream).json();
 document.body.innerHTML=payload.body; document.body.removeAttribute('style');
 const style=document.createElement('style');style.textContent=payload.css;document.head.appendChild(style);
 const script=document.createElement('script');script.textContent=payload.js;document.body.appendChild(script);
})().catch(err=>{document.body.innerHTML='<main style="max-width:420px;padding:28px;margin:auto;color:#ecf8f0;font:14px system-ui"><h1 style="color:#9cf4b6">BINARY 30 could not start</h1><p>'+String(err.message||err).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><p>Open the page online once in updated Chrome, then reload.</p></main>';});
</script></body></html>
