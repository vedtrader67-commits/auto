name: Validate BlackBox Reborn engine

on:
  push:
    branches: [blackbox-reborn-integration]
  workflow_dispatch:

jobs:
  build-blackbox-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Calculator project and pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973"
      - name: Build BlackBox Reborn debug APK
        working-directory: calculator-disguise/blackbox-engine
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload engine validation APK
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-reborn-engine-validation
          path: calculator-disguise/blackbox-engine/app/build/outputs/apk/debug/*.apk
          retention-days: 7
