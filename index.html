<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>NOVA Phone · Android-style simulator</title>
<style>
:root{--bg:#101827;--panel:#202b3c;--panel2:#2b374a;--text:#f4f7ff;--muted:#aab6ca;--accent:#a9c7ff;--accentText:#17243a;--line:#ffffff18}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#273c5b 0,#101827 56%,#080d16 100%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage{width:min(100%,430px);height:min(900px,calc(100dvh - 32px));min-height:560px;border:1px solid #ffffff2b;border-radius:38px;overflow:hidden;position:relative;background:linear-gradient(155deg,#243e60 0%,#17243d 42%,#372d58 100%);box-shadow:0 35px 100px #0009,inset 0 0 0 5px #050a12}
.status{height:34px;padding:9px 24px 0;display:flex;justify-content:space-between;font-size:12px;position:relative;z-index:3;letter-spacing:.2px}.status .right{display:flex;gap:8px;align-items:center}
.screen{height:calc(100% - 34px - 24px);overflow:auto;position:relative;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.nav{height:24px;display:flex;align-items:center;justify-content:center;position:absolute;bottom:0;width:100%;z-index:10;background:#10182722}.gesture{width:108px;height:4px;border-radius:8px;background:#fff;opacity:.9}
.wallpaper{min-height:100%;padding:24px 20px 26px;background:radial-gradient(ellipse at 15% 8%,#83b7ff77,transparent 38%),radial-gradient(ellipse at 85% 45%,#d2a2ff55,transparent 42%),linear-gradient(160deg,#243d60,#171d39 65%,#37264e);display:flex;flex-direction:column}
.widget{padding:16px 8px 24px;text-align:center;text-shadow:0 2px 18px #0005}.bigtime{font-size:64px;line-height:1.1;font-weight:300;letter-spacing:-3px}.date{font-size:14px;color:#e2eaff;margin-top:7px}.search{height:43px;border-radius:24px;background:#ffffffdf;color:#253047;display:flex;align-items:center;gap:10px;padding:0 15px;margin:0 0 22px;box-shadow:0 6px 22px #0002}.search input{border:0;background:transparent;outline:0;width:100%;color:#253047}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:auto;padding:18px 0}.appicon{background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;font-size:11px;color:#fff}.glyph{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#ffffff42,#ffffff12);border:1px solid #ffffff32;box-shadow:0 8px 20px #0002;backdrop-filter:blur(10px)}.dock{display:flex;justify-content:space-around;gap:12px;padding:12px 8px;background:#ffffff1c;border:1px solid #ffffff20;border-radius:27px;backdrop-filter:blur(18px);margin-top:8px}.dock .glyph{width:50px;height:50px}
.top-hint{text-align:center;color:#dce6ff70;font-size:11px;padding-top:15px}
.panel{padding:18px 18px 28px;min-height:100%;background:#121b2b;color:var(--text)}.panelhead{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.back{width:38px;height:38px;border-radius:50%;background:#ffffff14;font-size:20px}.title{font-size:25px;font-weight:650;letter-spacing:-.6px}.subtitle{color:var(--muted);font-size:13px;margin-top:4px}.card{padding:16px;border:1px solid var(--line);background:#ffffff08;border-radius:22px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.small{font-size:12px;color:var(--muted)}.pill{border-radius:30px;background:var(--accent);color:var(--accentText);padding:9px 14px;font-weight:650}.secondary{border-radius:14px;background:#ffffff12;padding:10px 13px}.field{width:100%;border:1px solid #ffffff22;border-radius:14px;background:#ffffff0c;color:var(--text);padding:12px;margin:7px 0}.field::placeholder{color:#aab6ca}.textarea{min-height:170px;resize:vertical}.quickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:17px 12px;border-radius:18px;background:#29364b;text-align:left}.tile.active{background:var(--accent);color:var(--accentText)}.tile b{display:block;font-size:15px;margin-top:9px}.tile span{font-size:21px}.app-list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;padding:10px 0}.app-list .glyph{width:57px;height:57px}.app-list .appicon{font-size:12px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.calc button{height:55px;border-radius:18px;background:#ffffff12;font-size:19px}.calc button.op{background:#a9c7ff;color:#17243a}.calcdisplay{font-size:38px;text-align:right;padding:25px 6px;min-height:95px;overflow-wrap:anywhere}.browserbar{display:flex;gap:7px}.browserbar input{min-width:0;flex:1}.browserframe{width:100%;height:55vh;border:1px solid var(--line);border-radius:16px;background:white}.toast{position:absolute;z-index:20;bottom:35px;left:18px;right:18px;background:#f4f7ff;color:#1b2638;border-radius:16px;padding:13px 16px;box-shadow:0 8px 30px #0005;text-align:center;animation:fade 2.8s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0;pointer-events:none}}
.lock{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 15%,#85b6ff88,transparent 38%),linear-gradient(150deg,#1c3657,#16152f 75%,#3c2752);text-align:center;padding:28px}.lock .bigtime{font-size:74px}.lock .unlock{margin-top:70px;background:#ffffff20;padding:14px 25px;border-radius:28px}.hidden{display:none!important}.labelcaps{font-size:11px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}.range{width:100%;accent-color:#a9c7ff}.footer-note{font-size:11px;color:#aab6ca;text-align:center;line-height:1.5;padding:18px 0}
@media(max-width:480px){body{padding:0;background:#101827}.stage{width:100%;height:100dvh;min-height:540px;border-radius:0;border:0;box-shadow:none}.screen{height:calc(100% - 58px)}.status{padding-top:max(9px,env(safe-area-inset-top))}.nav{bottom:env(safe-area-inset-bottom,0px)}}
</style>
</head>
<body>
<div class="stage" id="phone">
 <div class="status" id="status" onclick="openQuick()"><span id="statusTime">9:41</span><span class="right"><span>◈</span><span>▮▮▮</span><span id="battery">▰ 100%</span></span></div>
 <main class="screen" id="screen"></main>
 <div class="nav" onclick="goHome()" title="Home"><div class="gesture"></div></div>
 <div class="lock hidden" id="lock"><div style="font-size:34px;margin-bottom:28px">◈ NOVA</div><div class="bigtime" id="lockTime">9:41</div><div class="date" id="lockDate"></div><button class="unlock" onclick="unlockPhone()">↑ &nbsp; Swipe up to unlock</button><div class="small" style="margin-top:22px">Virtual device · browser simulation</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const screen=$('#screen');
const apps=[
 {id:'browser',name:'Browser',icon:'🌐',color:'#8bc4ff'},
 {id:'phone',name:'Phone',icon:'📞'},
 {id:'messages',name:'Messages',icon:'💬'},
 {id:'camera',name:'Camera',icon:'📷'},
 {id:'gallery',name:'Gallery',icon:'🌄'},
 {id:'settings',name:'Settings',icon:'⚙️'},
 {id:'calculator',name:'Calculator',icon:'🧮'},
 {id:'notes',name:'Notes',icon:'📝'},
 {id:'music',name:'Music',icon:'🎵'},
 {id:'calendar',name:'Calendar',icon:'📅'},
 {id:'files',name:'Files',icon:'📁'},
 {id:'ai',name:'NOVA AI',icon:'✦'}
];
let current='home', quick=false, locked=false, brightness=100, volume=65, wifi=true, bluetooth=false, airplane=false, calcExpr='', notes=localStorage.getItem('nova-notes')||'', brightnessBefore=100;
function now(){let d=new Date();return {time:d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}),date:d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'}),short:d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}}
function updateClock(){let n=now();$('#statusTime').textContent=n.time;$('#lockTime').textContent=n.time;$('#lockDate').textContent=n.date;let d=new Date();$('#homeTime')&&($('#homeTime').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}));$('#homeDate')&&($('#homeDate').textContent=n.date)}
setInterval(updateClock,1000);
function icon(a){return '<button class="appicon" onclick="openApp(\''+a.id+'\')"><span class="glyph">'+a.icon+'</span><span>'+a.name+'</span></button>'}
function home(){current='home';screen.innerHTML='<div class="wallpaper"><div class="widget"><div style="font-size:12px;letter-spacing:2px;margin-bottom:13px">N O V A</div><div class="bigtime" id="homeTime">09:41</div><div class="date" id="homeDate"></div></div><button class="search" onclick="openApp(\'browser\')"><span>⌕</span><input placeholder="Search or enter a website" readonly><span>🎙️</span></button><div class="grid">'+apps.slice(0,8).map(icon).join('')+'</div><div class="dock">'+apps.slice(0,4).map(a=>'<button class="appicon" onclick="openApp(\''+a.id+'\')"><span class="glyph">'+a.icon+'</span></button>').join('')+'</div><div class="top-hint">Tap an app · tap status bar for quick settings</div></div>';updateClock()}
function header(title,sub=''){return '<div class="panelhead"><button class="back" onclick="goHome()">‹</button><div><div class="title">'+title+'</div>'+(sub?'<div class="subtitle">'+sub+'</div>':'')+'</div></div>'}
function panel(html){screen.innerHTML='<div class="panel">'+html+'</div>'}
function openApp(id){current=id;quick=false;$('#lock').classList.add('hidden');let a=apps.find(x=>x.id===id);
 if(id==='settings'){settings();return}
 if(id==='calculator'){calculator();return}
 if(id==='notes'){notesApp();return}
 if(id==='browser'){browser();return}
 if(id==='ai'){ai();return}
 if(id==='phone'){panel(header('Phone','Virtual dialer')+'<div class="card"><div class="labelcaps">Dial a number</div><input id="dial" class="field" placeholder="Enter a number" inputmode="tel"><div style="text-align:center;padding:15px"><button class="pill" onclick="toast(\'Calling is simulated. No real call is placed.\')">📞 Call</button></div></div><div class="footer-note">This is a simulator. It cannot make real calls.</div>');return}
 if(id==='messages'){panel(header('Messages','Demo inbox')+'<div class="card">💬 <b>NOVA</b><p class="small">Welcome to your virtual phone! Messages here are examples only.</p></div><textarea class="field textarea" placeholder="Write a demo message..."></textarea><button class="pill" onclick="toast(\'Demo message saved only on this screen.\')">Send demo</button>');return}
 if(id==='camera'){panel(header('Camera','Camera simulator')+'<div style="height:290px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#52637a,#111827 65%);display:grid;place-items:center;font-size:54px">📷</div><div class="footer-note">Camera preview is simulated. This website does not access your camera.</div><div style="text-align:center"><button class="pill" onclick="toast(\'Photo simulation captured! 📸\')">● Capture demo photo</button></div>');return}
 if(id==='gallery'){panel(header('Gallery','Your virtual gallery')+'<div class="quickgrid"><div class="card" style="text-align:center;font-size:44px">🌅<div class="small">Wallpaper</div></div><div class="card" style="text-align:center;font-size:44px">🌌<div class="small">Night sky</div></div><div class="card" style="text-align:center;font-size:44px">🌸<div class="small">Flowers</div></div><div class="card" style="text-align:center;font-size:44px">🏞️<div class="small">Landscape</div></div></div><div class="footer-note">Sample gallery items only.</div>');return}
 if(id==='music'){panel(header('Music','Virtual music player')+'<div class="card" style="text-align:center;padding:32px 15px"><div style="font-size:72px">🎧</div><h2>Midnight Drive</h2><p class="small">NOVA Demo Playlist</p><input class="range" type="range" min="0" max="100" value="24"><div style="display:flex;justify-content:center;gap:28px;font-size:25px;margin-top:20px"><button onclick="toast(\'Previous demo track\')">⏮</button><button onclick="this.textContent=this.textContent===\'▶\'?\'⏸\':\'▶\';toast(\'Demo player only, no audio file loaded\')">▶</button><button onclick="toast(\'Next demo track\')">⏭</button></div></div>');return}
 if(id==='calendar'){let n=now();panel(header('Calendar','Today')+'<div class="card"><div style="font-size:46px;font-weight:300">'+new Date().getDate()+'</div><h3>'+n.date+'</h3><p class="small">No events scheduled</p></div><input id="event" class="field" placeholder="Add a demo event"><button class="pill" onclick="toast(\'Event added to this demo session\')">Add event</button>');return}
 if(id==='files'){panel(header('Files','Virtual storage')+'<div class="row"><span>📁 Downloads</span><span class="small">0 items</span></div><div class="row"><span>🖼️ Images</span><span class="small">4 samples</span></div><div class="row"><span>📄 Documents</span><span class="small">0 items</span></div><div class="footer-note">This is fictional storage, not your real phone files.</div>');return}
}
function settings(){panel(header('Settings','Personalize your virtual device')+'<div class="card"><div style="font-size:18px;font-weight:650">NOVA Phone</div><div class="small">Android-inspired web simulator · v1.0</div></div><div class="card"><div class="row"><span>📶 Internet</span><button class="secondary" onclick="wifi=!wifi;settings();toast(\'Wi-Fi simulation: \'+(wifi?\'on\':\'off\'))">'+(wifi?'On':'Off')+'</button></div><div class="row"><span>🔵 Bluetooth</span><button class="secondary" onclick="bluetooth=!bluetooth;settings()">'+(bluetooth?'On':'Off')+'</button></div><div class="row"><span>✈️ Airplane mode</span><button class="secondary" onclick="airplane=!airplane;settings()">'+(airplane?'On':'Off')+'</button></div><div class="row"><span>🔋 Battery</span><span>100% · simulated</span></div></div><div class="card"><label>☀️ Brightness <span id="brightVal">'+brightness+'%</span><input class="range" type="range" min="20" max="100" value="'+brightness+'" oninput="brightness=+this.value;document.getElementById(\'brightVal\').textContent=brightness+\'%\';document.getElementById(\'phone\').style.filter=\'brightness(\'+(0.55+brightness/220)+\')\'"></label><div style="height:16px"></div><label>🔊 Volume <span id="volVal">'+volume+'%</span><input class="range" type="range" min="0" max="100" value="'+volume+'" oninput="volume=+this.value;document.getElementById(\'volVal\').textContent=volume+\'%\'"></label></div><div class="card"><div class="row"><span>🎨 Wallpaper</span><button class="secondary" onclick="changeWallpaper()">Change</button></div><div class="row"><span>🔒 Lock screen</span><button class="secondary" onclick="lockPhone()">Preview</button></div><div class="row"><span>ℹ️ About simulator</span><button class="secondary" onclick="about()">Details</button></div></div>')}
function calculator(){panel(header('Calculator','Basic arithmetic')+'<div class="calcdisplay" id="calcdisplay">0</div><div class="calc">'+['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0','.','='].map(k=>'<button class="'+(['÷','×','−','+','='].includes(k)?'op':'')+'" onclick="calcKey(\''+k+'\')">'+k+'</button>').join('')+'</div>')}
function calcKey(k){let d=$('#calcdisplay');if(k==='AC')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){try{let exp=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/().%\s-]+$/.test(exp))throw 0;let out=Function('"use strict";return ('+exp+')')();if(!Number.isFinite(out))throw 0;calcExpr=String(Math.round(out*1e8)/1e8)}catch(e){calcExpr='Error'}}else if(k==='±'){if(calcExpr)calcExpr=calcExpr.startsWith('-')?calcExpr.slice(1):'-'+calcExpr}else calcExpr+=({'×':'*','÷':'/','−':'-'}[k]||k);d.textContent=calcExpr.replace(/\*/g,'×').replace(/\//g,'÷')||'0'}
function notesApp(){panel(header('Notes','Saved in this browser')+'<textarea id="notesText" class="field textarea" placeholder="Write anything...">'+escapeHtml(notes)+'</textarea><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="pill" onclick="notes= document.getElementById(\'notesText\').value;localStorage.setItem(\'nova-notes\',notes);toast(\'Note saved on this browser ✓\')">Save note</button><button class="secondary" onclick="document.getElementById(\'notesText\').value=\'\';notes=\'\';localStorage.removeItem(\'nova-notes\')">Clear</button></div><div class="footer-note">Notes stay in this browser's local storage.</div>')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function browser(){panel(header('Browser','Web browsing inside the virtual phone')+'<form class="browserbar" onsubmit="visit(event)"><input id="url" class="field" style="margin:0" placeholder="https://example.com"><button class="pill">Go</button></form><div id="browserInfo" class="small" style="padding:12px 2px">Some sites block embedding. If a page does not load, use “Open in new tab”.</div><div id="browserResult"></div><div class="card"><div class="labelcaps">Try a website</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="secondary" onclick="quickVisit('https://example.com')">Example</button><button class="secondary" onclick="quickVisit('https://wikipedia.org')">Wikipedia</button><button class="secondary" onclick="quickVisit('https://github.com')">GitHub</button></div></div>')}
function visit(e){e.preventDefault();let u=$('#url').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;try{let parsed=new URL(u);if(!['http:','https:'].includes(parsed.protocol))throw 0;$('#url').value=u;$('#browserResult').innerHTML='<div class="card"><b>'+escapeHtml(parsed.hostname)+'</b><p class="small">Loading in embedded view may be blocked by this website.</p><div style="display:flex;gap:8px"><button class="pill" onclick="openExternal(\''+encodeURIComponent(u)+'\')">Open in new tab ↗</button><button class="secondary" onclick="showFrame(\''+encodeURIComponent(u)+'\')">Try inside phone</button></div></div><div id="frameHolder"></div>'}catch(err){toast('Please enter a valid website address')}}function quickVisit(u){$('#url').value=u;visit({preventDefault(){}})}function openExternal(u){window.open(decodeURIComponent(u),'_blank','noopener,noreferrer')}function showFrame(u){$('#frameHolder').innerHTML='<iframe class="browserframe" sandbox="allow-forms allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer" src="'+decodeURIComponent(u).replace(/"/g,'&quot;')+'"></iframe>'}
function ai(){panel(header('NOVA AI','Offline demo assistant')+'<div class="card"><div style="font-size:35px">✦</div><h3>Hi, I'm NOVA</h3><p class="small">This is a demo assistant interface. It does not connect to an AI service yet.</p></div><input id="ask" class="field" placeholder="Ask something..."><button class="pill" onclick="askNOVA()">Send</button><div id="answer" class="card hidden"></div>')}
function askNOVA(){let q=$('#ask').value.trim();if(!q)return;$('#answer').classList.remove('hidden');$('#answer').innerHTML='<b>You asked:</b><p>'+escapeHtml(q)+'</p><p class="small">NOVA demo: AI connection is not configured yet. We can add a real AI service later.</p>'}
function openQuick(){quick=true;panel(header('Quick settings','Virtual device controls')+'<div class="quickgrid"><button class="tile '+(wifi?'active':'')+'" onclick="wifi=!wifi;openQuick()"><span>◉</span><b>Wi-Fi</b><small>'+(wifi?'On':'Off')+'</small></button><button class="tile '+(bluetooth?'active':'')+'" onclick="bluetooth=!bluetooth;openQuick()"><span>ᛒ</span><b>Bluetooth</b><small>'+(bluetooth?'On':'Off')+'</small></button><button class="tile '+(airplane?'active':'')+'" onclick="airplane=!airplane;openQuick()"><span>✈</span><b>Airplane mode</b><small>'+(airplane?'On':'Off')+'</small></button><button class="tile" onclick="openApp(\'settings\')"><span>⚙</span><b>Settings</b><small>Open system settings</small></button></div><div class="card"><label>☀ Brightness <input class="range" type="range" min="20" max="100" value="'+brightness+'" oninput="brightness=+this.value;document.getElementById(\'phone\').style.filter=\'brightness(\'+(0.55+brightness/220)+\')\'"></label></div><div class="card"><b>Notifications</b><p class="small">You're all caught up. This is your virtual notification shade.</p></div><button class="pill" onclick="goHome()">Done</button>')}
function goHome(){quick=false;home()}
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());let t=document.createElement('div');t.className='toast';t.textContent=msg;$('#phone').appendChild(t);setTimeout(()=>t.remove(),2900)}
function changeWallpaper(){let styles=['radial-gradient(ellipse at 15% 8%,#83b7ff77,transparent 38%),radial-gradient(ellipse at 85% 45%,#d2a2ff55,transparent 42%),linear-gradient(160deg,#243d60,#171d39 65%,#37264e)','radial-gradient(ellipse at 80% 20%,#ff9acb88,transparent 40%),linear-gradient(150deg,#402953,#171b39 60%,#0b5260)','radial-gradient(ellipse at 30% 20%,#9bffdd77,transparent 40%),linear-gradient(150deg,#174c53,#15253e 65%,#251c45)'];let i=Number(localStorage.getItem('nova-wallpaper')||0);i=(i+1)%styles.length;localStorage.setItem('nova-wallpaper',i);document.querySelector('.wallpaper')?.style.setProperty('background',styles[i]);toast('Wallpaper changed')}
function lockPhone(){$('#lock').classList.remove('hidden');locked=true;updateClock()}function unlockPhone(){$('#lock').classList.add('hidden');locked=false;toast('Welcome back!')}function about(){panel(header('About NOVA')+'<div class="card"><h3>NOVA Phone Simulator</h3><p class="small">An Android-inspired interactive website prototype. It is not Android or an emulator, and its simulated system toggles do not change your real device.</p><p class="small">Version 1.0 · Built for the web</p></div>')}
let startY=null;$('#phone').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});$('#phone').addEventListener('touchend',e=>{if(startY!==null){let dy=e.changedTouches[0].clientY-startY;if(dy>90&&startY<100)openQuick();if(dy< -100&&$('#lock')&&!$('#lock').classList.contains('hidden'))unlockPhone();startY=null}},{passive:true});
home();
</script>
</body>
</html>
