services:
  - type: web
    name: auto-browser-test-runner
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://vedtrader67-commits.github.io
      - key: ALLOWED_TARGET_HOSTS
        value: ""
      - key: MAX_SESSIONS
        value: "3"
      - key: MAX_DURATION_SECONDS
        value: "300"
